name: Deploy

# Vercel (frontend) is handled automatically by Vercel's GitHub integration
# on every push to main — no CI step needed.
# This workflow only manages Railway (backend) and Supabase migrations.

on:
  push:
    branches: [main]

jobs:
  # ── Deploy FastAPI → Railway ─────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach

  # ── Push Supabase migrations ─────────────────────────────────────────────────
  deploy-migrations:
    name: Push Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
