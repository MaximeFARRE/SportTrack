name: CI

on:
  push:
    branches: [pivot/v2, main]
  pull_request:
    branches: [pivot/v2, main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        run: python -m ruff check app/

      - name: Type check (mypy)
        run: python -m mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # mypy has pre-existing issues in legacy code

      - name: Tests (pytest)
        env:
          # Minimal env for service-less tests
          DATABASE_URL: sqlite:///./test.db
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          JWT_SECRET: placeholder_secret_for_ci
          INTERNAL_SECRET: placeholder
        run: python -m pytest --tb=short -q

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
