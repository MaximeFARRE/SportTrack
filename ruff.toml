line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-length enforced by formatter, not linter
    "E712",  # SQLAlchemy uses == True/False as column expressions, not Python bools
]

[lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]  # intentional public re-exports
